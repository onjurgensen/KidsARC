defaults:                       # non-reasoning models
  system_prompt: "You are a helpful assistant that solves analogy making puzzles. Only give the answer, no other words or text."
  temperature: 0
  max_tokens: 100
  concurrency: 8
  timeout: 120
  allow_fallbacks: false

reasoning_defaults:             # applied on top of defaults when type: reasoning
  temperature: null             # not sent; reasoning APIs ignore or reject it
  max_tokens: 16000
  concurrency: 4
  timeout: 1800

models:
  # Llama
  - id: meta-llama/llama-3.1-8b-instruct
    provider: deepinfra/fp8
  - id: meta-llama/llama-3.1-70b-instruct
    provider: deepinfra/turbo
  - id: meta-llama/llama-3.3-70b-instruct
    provider: deepinfra/turbo
  - id: meta-llama/llama-4-maverick
    provider: novita/fp8
  # DeepSeek
  - id: deepseek/deepseek-chat        # DeepSeek-V3
    provider: deepinfra/fp4           # no fp8 provider
  - id: deepseek/deepseek-v4-pro-0813
    type: reasoning
    provider: novita/fp8
    reasoning: {effort: medium}
  - id: deepseek/deepseek-v4.1-flash
    type: reasoning
    provider: deepinfra/fp8
    reasoning: {effort: medium}
  # Open AI
  - id: openai/gpt-3.5-turbo
    provider: openai
  - id: openai/gpt-4o
    provider: openai
  - id: openai/o4-mini
    type: reasoning
    provider: openai
    reasoning: {effort: medium}
  - id: openai/gpt-6-luna
    type: reasoning
    provider: openai
    reasoning: {effort: medium}
  # Anthropic
  - id: anthropic/claude-haiku-4.5       # 2025; smaller tier than Sonnet 5.5 (size confound)
    type: reasoning
    provider: anthropic
    reasoning: {effort: medium}
  # - id: anthropic/claude-sonnet-5.5
  #   type: reasoning
  #   provider: anthropic
  #   reasoning: {effort: medium}
  # Qwen
  # - id: qwen/qwen-2.5-72b-instruct
  #   provider: deepinfra/fp8
  - id: qwen/qwen3-32b
    type: reasoning
    provider: deepinfra/fp8
    reasoning: {enabled: true}
  # - id: qwen/qwen3.8-27b
  #   type: reasoning
  #   provider: deepinfra/bf16          # full precision
  #   reasoning: {enabled: true}        # effort param accepted; test whether it has an effect
  # google
  - id: google/gemma-3-27b-it
    provider: deepinfra/fp8
  - id: google/gemini-3.8-flash    # 2026; preview, see note
    type: reasoning
    provider: google-vertex/global/flex
    reasoning: {effort: medium}



